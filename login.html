<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Subhan Property | User Login</title>

<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background: #f5f5f5;
}

.login-box {
    background: white;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    width: 90%;
    max-width: 380px;
}

h2 {
    text-align: center;
    color: #123f66;
    margin-bottom: 5px;
}

h3 {
    text-align: center;
    color: #555;
    font-weight: normal;
}

input,
button {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border-radius: 7px;
    box-sizing: border-box;
}

input {
    border: 1px solid #ccc;
}

button {
    background: #123f66;
    color: white;
    border: none;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0b2e4d;
}

.links {
    text-align: center;
    margin-top: 15px;
}

.links a {
    color: #0066cc;
    text-decoration: none;
    display: block;
    margin: 8px;
}

#msg {
    text-align: center;
    margin-top: 12px;
}
</style>
</head>

<body>

<div class="login-box">

    <h2>Subhan Property</h2>
    <h3>User Login</h3>

    <input
        type="email"
        id="email"
        placeholder="Enter Email"
    >

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
    >

    <button onclick="login()">
        Login
    </button>

    <button onclick="signup()">
        Sign Up
    </button>

    <div class="links">

        <a href="reset-password.html">
            Forgot Password?
        </a>

        <a href="index.html">
            Continue to Website
        </a>

    </div>

    <p id="msg"></p>

</div>


<script type="module">

import { supabase } from "./supabase.js";


const msg =
    document.getElementById("msg");


window.login = async function() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if (!email || !password) {

        msg.style.color = "red";
        msg.innerText =
            "Email aur password enter karein.";

        return;
    }


    msg.style.color = "#333";
    msg.innerText = "Login ho raha hai...";


    const { error } =
        await supabase.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        msg.style.color = "red";
        msg.innerText =
            error.message;

        return;
    }


    msg.style.color = "green";
    msg.innerText =
        "Login successful!";


    setTimeout(() => {

        window.location.href =
            "index.html";

    }, 500);

};



window.signup = async function() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if (!email || !password) {

        msg.style.color = "red";
        msg.innerText =
            "Email aur password enter karein.";

        return;
    }


    if (password.length < 6) {

        msg.style.color = "red";
        msg.innerText =
            "Password kam az kam 6 characters ka hona chahiye.";

        return;
    }


    msg.style.color = "#333";
    msg.innerText =
        "Account create ho raha hai...";


    const { data, error } =
        await supabase.auth.signUp({

            email: email,

            password: password

        });


    if (error) {

        msg.style.color = "red";
        msg.innerText =
            error.message;

        return;
    }


    msg.style.color = "green";

    msg.innerText =
        "Account ban gaya! Agar email confirmation on hai to Gmail check karein.";

};

</script>

</body>
</html>
