<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Property | Subhan Property</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <style>

        #previewContainer {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .previewBox {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ddd;
            background: #f5f5f5;
        }

        .previewBox img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .removeImage {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #d60000;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 16px;
        }

        #photoCount {
            margin-top: 8px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<header>

    <h1>
        SUBHAN PROPERTY
    </h1>

    <p>
        Add New Property
    </p>

</header>


<nav>

    <a href="dashboard.html">
        Dashboard
    </a>

    <a href="add-property.html">
        Add Property
    </a>

    <a href="../index.html">
        View Website
    </a>

</nav>


<section class="admin-dashboard">


    <h2>
        ➕ Add New Property
    </h2>


    <form id="propertyForm">


        <label>
            Property Name
        </label>

        <input
            type="text"
            id="propertyName"
            placeholder="e.g. 5 Marla Plot"
            required
        >


        <label>
            Plot Size
        </label>

        <input
            type="text"
            id="propertySize"
            placeholder="e.g. 5 Marla"
            required
        >


        <label>
            Price
        </label>

        <input
            type="text"
            id="propertyPrice"
            placeholder="e.g. 25 Lac"
            required
        >


        <label>
            Location
        </label>

        <input
            type="text"
            id="propertyLocation"
            placeholder="e.g. Khanpur"
            required
        >


        <label>
            Property Details
        </label>

        <textarea
            id="propertyDetails"
            placeholder="Enter property details"
            required
        ></textarea>


        <label>
            Property Images
        </label>

        <input
            type="file"
            id="propertyImage"
            accept="image/*"
            multiple
            required
        >

        <p id="photoCount">
            0 photos selected
        </p>


        <div id="previewContainer"></div>


        <br>


        <button
            type="submit"
        >
            Publish Property
        </button>


    </form>


    <p id="message"></p>


</section>


<script type="module">


import { supabase }
    from "../supabase.js";


const form =
    document.getElementById(
        "propertyForm"
    );


const message =
    document.getElementById(
        "message"
    );


const imageInput =
    document.getElementById(
        "propertyImage"
    );


const previewContainer =
    document.getElementById(
        "previewContainer"
    );


const photoCount =
    document.getElementById(
        "photoCount"
    );


let selectedFiles = [];


/* =========================
   IMAGE RESIZE
========================= */

function resizeImage(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    const image =
                        new Image();


                    image.onload =
                        function() {

                            const maxWidth = 800;

                            let width =
                                image.width;

                            let height =
                                image.height;


                            if (
                                width > maxWidth
                            ) {

                                height =
                                    height *
                                    (
                                        maxWidth /
                                        width
                                    );

                                width =
                                    maxWidth;

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const context =
                                canvas.getContext(
                                    "2d"
                                );


                            context.drawImage(
                                image,
                                0,
                                0,
                                width,
                                height
                            );


                            const imageData =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.70
                                );


                            resolve(
                                imageData
                            );

                        };


                    image.onerror =
                        reject;


                    image.src =
                        event.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================
   IMAGE PREVIEW
========================= */

imageInput.addEventListener(
    "change",
    function() {

        selectedFiles =
            Array.from(
                this.files
            );


        showPreviews();

    }
);


/* =========================
   SHOW PREVIEWS
========================= */

function showPreviews() {

    previewContainer.innerHTML = "";


    photoCount.textContent =
        selectedFiles.length
        +
        (
            selectedFiles.length === 1
                ? " photo selected"
                : " photos selected"
        );


    selectedFiles.forEach(
        function(file, index) {

            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    const box =
                        document.createElement(
                            "div"
                        );


                    box.className =
                        "previewBox";


                    const img =
                        document.createElement(
                            "img"
                        );


                    img.src =
                        event.target.result;


                    const removeButton =
                        document.createElement(
                            "button"
                        );


                    removeButton.type =
                        "button";


                    removeButton.className =
                        "removeImage";


                    removeButton.textContent =
                        "×";


                    removeButton.onclick =
                        function() {

                            selectedFiles.splice(
                                index,
                                1
                            );

                            updateFileInput();

                            showPreviews();

                        };


                    box.appendChild(
                        img
                    );


                    box.appendChild(
                        removeButton
                    );


                    previewContainer.appendChild(
                        box
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================
   UPDATE FILE INPUT
========================= */

function updateFileInput() {

    const dataTransfer =
        new DataTransfer();


    selectedFiles.forEach(
        function(file) {

            dataTransfer.items.add(
                file
            );

        }
    );


    imageInput.files =
        dataTransfer.files;

}


/* =========================
   SUBMIT PROPERTY
========================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        message.textContent =
            "⏳ Property save ho rahi hai...";


        try {


            const title =
                document
                    .getElementById(
                        "propertyName"
                    )
                    .value
                    .trim();


            const size =
                document
                    .getElementById(
                        "propertySize"
                    )
                    .value
                    .trim();


            const price =
                document
                    .getElementById(
                        "propertyPrice"
                    )
                    .value
                    .trim();


            const location =
                document
                    .getElementById(
                        "propertyLocation"
                    )
                    .value
                    .trim();


            const detailsText =
                document
                    .getElementById(
                        "propertyDetails"
                    )
                    .value
                    .trim();


            if (
                selectedFiles.length === 0
            ) {

                message.textContent =
                    "❌ Kam az kam 1 photo select karein.";

                return;

            }


            message.textContent =
                "⏳ Photos prepare ho rahi hain...";


            const images = [];


            for (
                const file of selectedFiles
            ) {

                const image =
                    await resizeImage(
                        file
                    );


                images.push(
                    image
                );

            }


            const details = {

                description:
                    detailsText,

                images:
                    images,

                /* Old system compatibility */
                image:
                    images[0]

            };


            message.textContent =
                "⏳ Property database mein save ho rahi hai...";


            const { error } =
                await supabase

                    .from("properties")

                    .insert([{

                        title:
                            title,

                        size:
                            size,

                        price:
                            price,

                        location:
                            location,

                        details:
                            JSON.stringify(
                                details
                            )

                    }]);


            if (error) {

                console.error(
                    error
                );


                message.textContent =
                    "❌ Property save nahi hui: "
                    +
                    error.message;

                return;

            }


            message.textContent =
                "✅ Property successfully added!";


            form.reset();


            selectedFiles = [];


            previewContainer.innerHTML =
                "";


            photoCount.textContent =
                "0 photos selected";


        }

        catch (error) {

            console.error(
                error
            );


            message.textContent =
                "❌ Error: "
                +
                error.message;

        }

    }
);


</script>


</body>

</html>
