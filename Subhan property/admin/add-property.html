<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Property | Subhan Property</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body>


<header>

    <h1>
        SUBHAN PROPERTY
    </h1>

    <p>
        Add New Property
    </p>

</header>


<nav>

    <a href="dashboard.html">
        Dashboard
    </a>

    <a href="add-property.html">
        Add Property
    </a>

    <a href="../index.html">
        View Website
    </a>

</nav>



<section class="admin-dashboard">


    <h2>
        ➕ Add New Property
    </h2>



    <form id="propertyForm">


        <label>
            Property Name
        </label>

        <input
            type="text"
            id="propertyName"
            placeholder="e.g. 5 Marla Plot"
            required
        >



        <label>
            Plot Size
        </label>

        <input
            type="text"
            id="propertySize"
            placeholder="e.g. 5 Marla"
            required
        >



        <label>
            Price
        </label>

        <input
            type="text"
            id="propertyPrice"
            placeholder="e.g. 25 Lac"
            required
        >



        <label>
            Location
        </label>

        <input
            type="text"
            id="propertyLocation"
            placeholder="e.g. Khanpur"
            required
        >



        <label>
            Property Details
        </label>

        <textarea
            id="propertyDetails"
            placeholder="Enter property details"
            required
        ></textarea>



        <label>
            Property Image
        </label>

        <input
            type="file"
            id="propertyImage"
            accept="image/*"
            required
        >



        <button
            type="submit"
        >
            Publish Property
        </button>


    </form>



    <p id="message"></p>


</section>



<script type="module">


import { supabase }
    from "../supabase.js";



const form =
    document.getElementById(
        "propertyForm"
    );


const message =
    document.getElementById(
        "message"
    );



function resizeImage(file) {

    return new Promise(
        (resolve, reject) => {


            const reader =
                new FileReader();


            reader.onload =
                function(event) {


                    const image =
                        new Image();


                    image.onload =
                        function() {


                            const maxWidth = 800;


                            let width =
                                image.width;


                            let height =
                                image.height;



                            if (
                                width > maxWidth
                            ) {

                                height =
                                    height *
                                    (
                                        maxWidth /
                                        width
                                    );

                                width =
                                    maxWidth;

                            }



                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;


                            canvas.height =
                                height;



                            const context =
                                canvas.getContext(
                                    "2d"
                                );


                            context.drawImage(
                                image,
                                0,
                                0,
                                width,
                                height
                            );



                            const imageData =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.70
                                );


                            resolve(
                                imageData
                            );


                        };


                    image.onerror =
                        reject;


                    image.src =
                        event.target.result;


                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );


        }
    );

}



form.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();



        message.textContent =
            "⏳ Property save ho rahi hai...";



        try {


            const title =
                document
                    .getElementById(
                        "propertyName"
                    )
                    .value
                    .trim();



            const size =
                document
                    .getElementById(
                        "propertySize"
                    )
                    .value
                    .trim();



            const price =
                document
                    .getElementById(
                        "propertyPrice"
                    )
                    .value
                    .trim();



            const location =
                document
                    .getElementById(
                        "propertyLocation"
                    )
                    .value
                    .trim();



            const detailsText =
                document
                    .getElementById(
                        "propertyDetails"
                    )
                    .value
                    .trim();



            const imageFile =
                document
                    .getElementById(
                        "propertyImage"
                    )
                    .files[0];



            if (!imageFile) {

                message.textContent =
                    "❌ Property image select karein.";

                return;

            }



            message.textContent =
                "⏳ Image prepare ho rahi hai...";



            const image =
                await resizeImage(
                    imageFile
                );



            const details = {

                description:
                    detailsText,

                image:
                    image

            };



            const { error } =
                await supabase

                    .from("properties")

                    .insert([{

                        title:
                            title,

                        size:
                            size,

                        price:
                            price,

                        location:
                            location,

                        details:
                            JSON.stringify(
                                details
                            )

                    }]);



            if (error) {

                console.error(
                    error
                );


                message.textContent =
                    "❌ Property save nahi hui: "
                    +
                    error.message;

                return;

            }



            message.textContent =
                "✅ Property successfully added!";



            form.reset();


        }

        catch (error) {


            console.error(
                error
            );


            message.textContent =
                "❌ Error: "
                +
                error.message;


        }


    }
);


</script>


</body>

</html>
