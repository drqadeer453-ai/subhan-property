<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>
    Reset Password | Subhan Property
</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
    }
    .reset-box {
        width: 330px;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow:
            0 5px 25px
            rgba(0,0,0,0.12);
    }
    h2 {
        text-align: center;
        color: #17365d;
        margin-bottom: 25px;
    }
    input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }
    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #17365d;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background: #0f2948;
    }
    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    #message {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
    }
</style>
</head>
<body>
<div class="reset-box">
<h2>
    Reset Password
</h2>
<form id="resetForm">
    <input
        type="password"
        id="newPassword"
        placeholder="New Password"
        minlength="6"
        required
    >
    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm New Password"
        minlength="6"
        required
    >
    <button
        type="submit"
        id="resetBtn"
    >
        Update Password
    </button>
    <div id="message"></div>
</form>
</div>
<script type="module">
import { supabase }
    from "../supabase.js";
const form =
    document.getElementById(
        "resetForm"
    );
const newPassword =
    document.getElementById(
        "newPassword"
    );
const confirmPassword =
    document.getElementById(
        "confirmPassword"
    );
const resetBtn =
    document.getElementById(
        "resetBtn"
    );
const message =
    document.getElementById(
        "message"
    );
form.addEventListener(
    "submit",
    async function(e) {
        e.preventDefault();
        message.textContent = "";
        if (
            newPassword.value
            !==
            confirmPassword.value
        ) {
            message.textContent =
                "❌ Passwords do not match.";
            message.style.color =
                "red";
            return;
        }
        resetBtn.textContent =
            "Updating...";
        resetBtn.disabled =
            true;
        const { error } =
            await supabase.auth
                .updateUser({
                    password:
                        newPassword.value
                });
        if (error) {
            console.error(error);
            message.textContent =
                "❌ " + error.message;
            message.style.color =
                "red";
            resetBtn.textContent =
                "Update Password";
            resetBtn.disabled =
                false;
            return;
        }
        message.textContent =
            "✅ Password updated successfully!";
        message.style.color =
            "green";
        resetBtn.textContent =
            "Password Updated";
        setTimeout(
            function() {
                window.location.href =
                    "login.html";
            },
            2000
        );
    }
);
</script>
</body>
</html>
