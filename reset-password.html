<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
  <style>
    body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f5f5f5; }
    .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
    input, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; }
    button { background: green; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Reset Password</h2>
    <p>Apna email likho, reset link bhej denge</p>
    <input type="email" id="email" placeholder="Email">
    <button onclick="reset()">Send Reset Link</button>
    <p><a href="index.html">Back to Login</a></p>
    <p id="msg"></p>
  </div>

<script type="module">
import { supabase } from "./supabase.js";

window.reset = async function() {
  let email = document.getElementById('email').value;
  let msg = document.getElementById('msg');

  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://erty.vercel.app/update-password.html' // بعد میں یہ link بدل دینا
  });

  if (error) {
    msg.style.color = 'red';
    msg.innerText = error.message;
  } else {
    msg.style.color = 'green';
    msg.innerText = "Reset link bhej diya gaya hai! Email check karo";
  }
}
</script>

</body>
</html>
